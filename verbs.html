<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tha động từ / Tự động từ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        .app-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .header-container {
            width: 100%;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .dropdown {
            position: absolute;
            left: 0;
        }
        .icon-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .icon-btn:hover {
            transform: scale(1.1);
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 280px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 10;
            border-radius: 8px;
            top: 40px;
            left: 0;
            text-align: left;
        }
        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-weight: bold;
            transition: background 0.2s;
            border-bottom: 1px solid #eee;
        }
        .dropdown-content a:last-child { border-bottom: none; }
        .dropdown-content a:hover { background-color: #f1f1f1; border-radius: 8px; }
        .show { display: block; }
        
        .flashcard-container {
            perspective: 1000px;
            margin: 20px 0;
            height: 380px;
            cursor: pointer;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-radius: 15px;
            background-color: white;
        }
        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            padding: 20px;
            box-sizing: border-box;
        }
        .card-back {
            transform: rotateY(180deg);
            background-color: #fdfbf7;
            border: 2px solid #e0dcd3;
        }
        .verb-type-tag {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
        }
        .transitive { background-color: #E91E63; }
        .intransitive { background-color: #00BCD4; }
        
        .speaker-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #f0f0f0;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 45px;
            height: 45px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .speaker-btn:hover { background-color: #e0e0e0; }
        .speaker-btn:active { transform: scale(0.92); }
        
        .word-kana {
            font-size: 44px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .word-vn {
            font-size: 22px;
            color: #1976D2;
            font-weight: bold;
        }
        .example-sentence {
            font-size: 20px;
            color: #444;
            margin-top: 25px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 8px;
            border-left: 4px solid #2196F3;
            width: 90%;
            text-align: left;
            line-height: 1.8;
        }
        rt {
            font-size: 12px;
            color: #777;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
        .nav-btn {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-btn:hover { background-color: #1565C0; }
        .nav-btn:active { transform: scale(0.92); }
        .nav-btn:disabled { background-color: #ccc; cursor: not-allowed; transform: none !important; }
        .progress { font-size: 18px; color: #555; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-container">
        <div class="dropdown">
            <button class="icon-btn" onclick="toggleMenu(event)">💡</button>
            <div id="dropdown-menu" class="dropdown-content">
                <a href="index.html">Từ trái nghĩa (Tính từ)</a>
                <a href="verbs.html">Tự/Tha động từ (自動詞他動詞練習)</a>
            </div>
        </div>
        <h2>Động từ (Tự / Tha)</h2>
    </div>
    
    <div class="flashcard-container" onclick="flipCard()">
        <div class="flashcard" id="flashcard">
            <!-- Front: Transitive -->
            <div class="card-face card-front">
                <div class="verb-type-tag transitive">Tha động từ (他動詞)</div>
                <button class="speaker-btn" id="front-speaker">🔊</button>
                <div class="word-kana" id="front-headword"></div>
                <div class="word-vn" id="front-vn"></div>
                <div class="example-sentence" id="front-example"></div>
            </div>
            <!-- Back: Intransitive -->
            <div class="card-face card-back">
                <div class="verb-type-tag intransitive">Tự động từ (自動詞)</div>
                <button class="speaker-btn" id="back-speaker">🔊</button>
                <div class="word-kana" id="back-headword"></div>
                <div class="word-vn" id="back-vn"></div>
                <div class="example-sentence" id="back-example"></div>
            </div>
        </div>
    </div>
    <div class="controls">
        <button class="nav-btn" onclick="prevCard()" id="btn-prev">&lt;&lt;</button>
        <div class="progress"><span id="current-idx">1</span> / <span id="total-cards"></span></div>
        <button class="nav-btn" onclick="nextCard()" id="btn-next">&gt;&gt;</button>
    </div>
</div>

": {"kanji": "並べる", "html": "<ruby>並<rt>なら</rt></ruby>べる", "meaning": "sắp xếp, bày ra", "example_text": "椅子を並べる。", "example_html": "<ruby>椅子<rt>いす</rt></ruby>を<ruby>並<rt>なら</rt></ruby>べる。"}, "vi": {"kanji": "並ぶ", "html": "<ruby>並<rt>なら</rt></ruby>ぶ", "meaning": "xếp hàng, đứng thẳng hàng", "example_text": "列に並ぶ。", "example_html": "<ruby>列<rt>れつ</rt></ruby>に<ruby>並<rt>なら</rt></ruby>ぶ。"}}, {"vt": {"kanji": "こぼす", "html": "<ruby>こぼす</ruby>", "meaning": "làm đổ, làm tràn", "example_text": "ジュースをこぼす。", "example_html": "ジュースをこぼす。"}, "vi": {"kanji": "こぼれる", "html": "こぼれる", "meaning": "bị đổ, bị tràn ra", "example_text": "ジュースがこぼれる。", "example_html": "ジュースがこぼれる。"}}, {"vt": {"kanji": "乱す", "html": "<ruby>乱<rt>みだ</rt></ruby>す", "meaning": "làm rối loạn, làm mất trật tự", "example_text": "髪を乱す。", "example_html": "<ruby>髪<rt>かみ</rt></ruby>を<ruby>乱<rt>みだ</rt></ruby>す。"}, "vi": {"kanji": "乱れる", "html": "<ruby>乱<rt>みだ</rt></ruby>れる", "meaning": "bị rối, xáo trộn, mất trật tự", "example_text": "髪が乱れる。", "example_html": "<ruby>髪<rt>かみ</rt></ruby>が<ruby>乱<rt>みだ</rt></ruby>れる。"}}, {"vt": {"kanji": "届ける", "html": "<ruby>届<rt>とど</rt></ruby>ける", "meaning": "gửi đến, chuyển phát, báo cáo", "example_text": "手紙を届ける。", "example_html": "<ruby><ruby>手<rt>て</rt></ruby><ruby>紙<rt>かみ</rt></ruby><rt>てがみ</rt></ruby>を<ruby>届<rt>とど</rt></ruby>ける。"}, "vi": {"kanji": "届く", "html": "<ruby>届<rt>とど</rt></ruby>く", "meaning": "được gửi đến, chạm tới", "example_text": "手紙が届く。", "example_html": "<ruby><ruby>手<rt>て</rt></ruby><ruby>紙<rt>かみ</rt></ruby><rt>てがみ</rt></ruby>が<ruby>届<rt>とど</rt></ruby>く。"}}, {"vt": {"kanji": "回す", "html": "<ruby>回<rt>まわ</rt></ruby>す", "meaning": "xoay, quay (vật gì)", "example_text": "地球儀を回す。", "example_html": "<ruby><ruby>地球<rt>ちきゅう</rt></ruby>儀<rt>ちきゅうぎ</rt></ruby>を<ruby>回<rt>まわ</rt></ruby>す。"}, "vi": {"kanji": "回る", "html": "<ruby>回<rt>まわ</rt></ruby>る", "meaning": "quay, xoay quanh", "example_text": "地球が回る。", "example_html": "<ruby>地球<rt>ちきゅう</rt></ruby>が<ruby>回<rt>まわ</rt></ruby>る。"}}, {"vt": {"kanji": "折る", "html": "<ruby>折<rt>お</rt></ruby>る", "meaning": "bẻ gãy, gập lại", "example_text": "骨を折る。", "example_html": "<ruby>骨<rt>ほね</rt></ruby>を<ruby>折<rt>お</rt></ruby>る。"}, "vi": {"kanji": "折れる", "html": "<ruby>折<rt>お</rt></ruby>れる", "meaning": "bị gãy, gập", "example_text": "骨が折れる。", "example_html": "<ruby>骨<rt>ほね</rt></ruby>が<ruby>折<rt>お</rt></ruby>れる。"}}, {"vt": {"kanji": "破る", "html": "<ruby>破<rt>やぶ</rt></ruby>る", "meaning": "xé rách, phá vỡ", "example_text": "紙を破る。", "example_html": "<ruby>紙<rt>かみ</rt></ruby>を<ruby>破<rt>やぶ</rt></ruby>る。"}, "vi": {"kanji": "破れる", "html": "<ruby>破<rt>やぶ</rt></ruby>れる", "meaning": "bị rách, thủng", "example_text": "紙が破れる。", "example_html": "<ruby>紙<rt>かみ</rt></ruby>が<ruby>破<rt>やぶ</rt></ruby>れる。"}}, {"vt": {"kanji": "割る", "html": "<ruby>割<rt>わ</rt></ruby>る", "meaning": "làm vỡ, đập vỡ, chia nhỏ", "example_text": "お皿を割る。", "example_html": "お<ruby>皿<rt>さら</rt></ruby>を<ruby>割<rt>わ</rt></ruby>る。"}, "vi": {"kanji": "割れる", "html": "<ruby>割<rt>わ</rt></ruby>れる", "meaning": "bị vỡ, nứt", "example_text": "お皿が割れる。", "example_html": "お<ruby>皿<rt>さら</rt></ruby>が<ruby>割<rt>わ</rt></ruby>れる。"}}, {"vt": {"kanji": "上げる", "html": "<ruby>上<rt>あ</rt></ruby>げる", "meaning": "nâng lên, giơ lên", "example_text": "手を上げる。", "example_html": "<ruby>手<rt>て</rt></ruby>を<ruby>上<rt>あ</rt></ruby>げる。"}, "vi": {"kanji": "上がる", "html": "<ruby>上<rt>あ</rt></ruby>がる", "meaning": "tăng lên, lên cao", "example_text": "気温が上がる。", "example_html": "<ruby>気温<rt>きおん</rt></ruby>が<ruby>上<rt>あ</rt></ruby>がる。"}}, {"vt": {"kanji": "下げる", "html": "<ruby>下<rt>さ</rt></ruby>げる", "meaning": "hạ xuống, giảm xuống", "example_text": "手を下げる。", "example_html": "<ruby>手<rt>て</rt></ruby>を<ruby>下<rt>さ</rt></ruby>げる。"}, "vi": {"kanji": "下がる", "html": "<ruby>下<rt>さ</rt></ruby>がる", "meaning": "giảm xuống, hạ xuống", "example_text": "気温が下がる。", "example_html": "<ruby>気温<rt>きおん</rt></ruby>が<ruby>下<rt>さ</rt></ruby>がる。"}}];
    let currentIndex = 0;

    function toggleMenu(event) {
        event.stopPropagation();
        document.getElementById("dropdown-menu").classList.toggle("show");
    }
    
    window.onclick = function(event) {
        if (!event.target.matches('.icon-btn')) {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            for (var i = 0; i < dropdowns.length; i++) {
                if (dropdowns[i].classList.contains('show')) {
                    dropdowns[i].classList.remove('show');
                }
            }
        }
    }

    function speakText(text, event) {
        if (event) event.stopPropagation();
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        
        // Remove ruby tags for speech
        let cleanText = text.replace(/<rt>.*?<\/rt>/g, '');
        cleanText = cleanText.replace(/<[^>]+>/g, '');
        
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'ja-JP';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }

    function renderCard() {
        const card = flashcards[currentIndex];
        
        // Front (Transitive)
        document.getElementById('front-headword').innerHTML = card.vt.html;
        document.getElementById('front-vn').textContent = card.vt.meaning;
        document.getElementById('front-example').innerHTML = card.vt.example_html;
        
        document.getElementById('front-speaker').onclick = (e) => speakText(card.vt.example_html, e);
        
        // Back (Intransitive)
        document.getElementById('back-headword').innerHTML = card.vi.html;
        document.getElementById('back-vn').textContent = card.vi.meaning;
        document.getElementById('back-example').innerHTML = card.vi.example_html;
        
        document.getElementById('back-speaker').onclick = (e) => speakText(card.vi.example_html, e);
        
        document.getElementById('current-idx').textContent = currentIndex + 1;
        document.getElementById('total-cards').textContent = flashcards.length;
        document.getElementById('btn-prev').disabled = currentIndex === 0;
        document.getElementById('btn-next').disabled = currentIndex === flashcards.length - 1;
        
        document.getElementById('flashcard').classList.remove('is-flipped');
    }

    function flipCard() {
        document.getElementById('flashcard').classList.toggle('is-flipped');
    }

    function nextCard() {
        if (currentIndex < flashcards.length - 1) {
            currentIndex++;
            renderCard();
        }
    }

    function prevCard() {
        if (currentIndex > 0) {
            currentIndex--;
            renderCard();
        }
    }

    renderCard();
</script>
