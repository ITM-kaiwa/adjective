<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tha động từ / Tự động từ</title>
    <style>
        :root {
            --sand-50: #FBF8F1;
            --sand-100: #F6F0E4;
            --sand-200: #EDE2CB;
            --sand-300: #E0CFA8;
            --sand-400: #CBAE78;
            --sand-500: #B08D57;
            --sand-600: #8C6D3F;
            --sand-700: #6B5230;
            --sand-800: #4C3A22;
            --lemon-100: #FDFAE2;
            --lemon-200: #FAF3B8;
            --lemon-300: #F4E888;
            --leaf-100: #E7F3DE;
            --leaf-200: #D0E8BE;
            --leaf-300: #B4D89A;
            --leaf-400: #95C476;
            --kanjibrown: #6B4226;
            --kanjibrown-dark: #4A2C18;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--sand-100);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        .app-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
            background: var(--sand-50);
            border-radius: 15px;
            box-shadow: 0 8px 24px -8px rgba(107, 66, 38, 0.35);
        }
        .header-container {
            width: 100%;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .dropdown {
            position: absolute;
            left: 0;
        }
        .icon-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .icon-btn:hover {
            transform: scale(1.1);
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: var(--sand-50);
            min-width: 280px;
            box-shadow: 0px 8px 16px 0px rgba(74, 44, 24, 0.25);
            z-index: 10;
            border-radius: 8px;
            top: 40px;
            left: 0;
            text-align: left;
        }
        .dropdown-content a {
            color: var(--kanjibrown-dark);
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-weight: bold;
            transition: background 0.2s;
            border-bottom: 1px solid var(--sand-200);
        }
        .dropdown-content a:last-child { border-bottom: none; }
        .dropdown-content a:hover { background-color: var(--sand-100); border-radius: 8px; }
        .show { display: block; }

        .flashcard-container {
            perspective: 1000px;
            margin: 20px 0;
            height: 440px;
            cursor: pointer;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 10px 20px rgba(107, 66, 38, 0.2);
            border-radius: 15px;
            background-color: var(--lemon-200);
            border: 2px solid var(--lemon-300);
        }
        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            padding: 20px;
            box-sizing: border-box;
        }
        .card-back {
            transform: rotateY(180deg);
            background-color: var(--lemon-100);
            border: 2px solid var(--lemon-300);
        }
        .verb-type-tag {
            position: absolute;
            top: 15px;
            left: 15px;
            color: var(--sand-50);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
        }
        .transitive { background-color: var(--sand-600); }
        .intransitive { background-color: var(--leaf-400); color: var(--kanjibrown-dark); }

        .speaker-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: var(--sand-200);
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 45px;
            height: 45px;
            box-shadow: 0 2px 5px rgba(107, 66, 38, 0.15);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .speaker-btn:hover { background-color: var(--sand-300); }
        .speaker-btn:active { transform: scale(0.92); }

        .word-kana {
            font-size: 44px;
            font-weight: bold;
            color: var(--kanjibrown);
            margin-bottom: 10px;
        }
        .word-vn {
            font-size: 22px;
            color: var(--kanjibrown-dark);
            font-weight: bold;
        }
        .example-sentence {
            font-size: 20px;
            color: var(--sand-800);
            margin-top: 25px;
            padding: 15px;
            background-color: var(--sand-50);
            border-radius: 8px;
            border-left: 4px solid var(--leaf-400);
            width: 90%;
            text-align: left;
            line-height: 1.8;
            max-height: 180px;
            overflow-y: auto;
            box-sizing: border-box;
        }
        rt {
            font-size: 12px;
            color: var(--sand-600);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
        .nav-btn {
            background-color: var(--leaf-200);
            color: var(--kanjibrown);
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-btn:hover { background-color: var(--leaf-300); }
        .nav-btn:active { transform: scale(0.92); }
        .nav-btn:disabled { background-color: var(--sand-200); color: var(--sand-400); cursor: not-allowed; transform: none !important; }
        .progress { font-size: 18px; color: var(--sand-700); font-weight: bold; }

        .example-vn {
            margin-top: 8px;
            font-size: 15px;
            color: var(--kanjibrown-dark);
            font-style: italic;
        }

        /* --- Admin / Settings Panel --- */
        .header-icons { position: absolute; right: 0; display: flex; gap: 6px; }
        .icon-circle-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: var(--sand-200);
            color: var(--sand-700);
            border: none;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .icon-circle-btn:hover { background-color: var(--sand-300); }
        .icon-circle-btn:active { transform: scale(0.92); }

        .admin-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(74, 44, 24, 0.45);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .admin-overlay.show { display: flex; }
        .admin-panel {
            background: var(--sand-50);
            border-radius: 15px;
            width: 100%;
            max-width: 900px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(74, 44, 24, 0.35);
            text-align: left;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--sand-300);
        }
        .admin-header h3 { margin: 0; font-size: 18px; color: var(--kanjibrown-dark); }
        .admin-close-btn {
            background: none; border: none; font-size: 24px; cursor: pointer; color: var(--sand-600);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .admin-close-btn:hover { color: var(--kanjibrown-dark); }
        .admin-close-btn:active { transform: scale(0.9); }
        .admin-body {
            padding: 16px 20px;
            overflow-y: auto;
        }
        .admin-search {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid var(--sand-300);
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        .admin-toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: var(--sand-100);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 14px;
        }
        .admin-toggle-row span { font-size: 14px; color: var(--kanjibrown-dark); }
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 26px;
            flex-shrink: 0;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--sand-300);
            transition: .3s;
            border-radius: 26px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px; width: 20px;
            left: 3px; bottom: 3px;
            background-color: var(--sand-50);
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--leaf-400); }
        input:checked + .slider:before { transform: translateX(20px); }
        .admin-count {
            font-size: 13px;
            color: var(--sand-600);
            margin-bottom: 8px;
        }
        .admin-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .admin-action-btn {
            background-color: var(--leaf-200);
            color: var(--kanjibrown-dark);
            border: none;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .admin-action-btn:hover { background-color: var(--leaf-300); }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .admin-table th, .admin-table td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--sand-200);
            vertical-align: top;
        }
        .admin-table th {
            background: var(--sand-100);
            color: var(--kanjibrown-dark);
            position: sticky;
            top: 0;
        }
        .admin-table tr:hover { background: var(--lemon-100); }

        /* --- Print --- */
        #print-area { display: none; }
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { display: block; position: absolute; top: 0; left: 0; width: 100%; }
            #print-area h2 { color: #000; }
            #print-area table { width: 100%; border-collapse: collapse; }
            #print-area th, #print-area td { border: 1px solid #333; padding: 6px 8px; font-size: 12px; text-align: left; }
            #print-area th { background: #eee; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-container">
        <div class="dropdown">
            <button class="icon-btn" onclick="toggleMenu(event)">💡</button>
            <div id="dropdown-menu" class="dropdown-content">
                <a href="index.html">Từ trái nghĩa (Tính từ)</a>
                <a href="verbs.html" style="color: #9C27B0;">Tự/Tha động từ (自動詞他動詞練習)</a>
                <a href="doushi.html">Động từ chung (一般動詞の対義語)</a>
            </div>
        </div>
        <h2>Động từ (Tự / Tha)</h2>
        <div class="header-icons">
            <button class="icon-circle-btn" onclick="shuffleCards()" title="Xáo trộn thẻ (Shuffle)">🔀</button>
            <button class="icon-circle-btn" onclick="openAdmin(event)" title="Quản lý dữ liệu">⚙️</button>
        </div>
    </div>
    
    <div class="flashcard-container" onclick="flipCard()">
        <div class="flashcard" id="flashcard">
            <!-- Front: Transitive -->
            <div class="card-face card-front">
                <div class="verb-type-tag transitive">Tha động từ (他動詞)</div>
                <button class="speaker-btn" id="front-speaker">🔊</button>
                <div class="word-kana" id="front-headword"></div>
                <div class="word-vn" id="front-vn"></div>
                <div class="example-sentence" id="front-example"></div>
            </div>
            <!-- Back: Intransitive -->
            <div class="card-face card-back">
                <div class="verb-type-tag intransitive">Tự động từ (自動詞)</div>
                <button class="speaker-btn" id="back-speaker">🔊</button>
                <div class="word-kana" id="back-headword"></div>
                <div class="word-vn" id="back-vn"></div>
                <div class="example-sentence" id="back-example"></div>
            </div>
        </div>
    </div>
    <div class="controls">
        <button class="nav-btn" onclick="prevCard()" id="btn-prev">&lt;&lt;</button>
        <div class="progress"><span id="current-idx">1</span> / <span id="total-cards"></span></div>
        <button class="nav-btn" onclick="nextCard()" id="btn-next">&gt;&gt;</button>
    </div>
</div>

<!-- ADMIN / SETTINGS PANEL -->
<div class="admin-overlay" id="admin-overlay" onclick="closeAdminOnOverlay(event)">
    <div class="admin-panel" onclick="event.stopPropagation()">
        <div class="admin-header">
            <h3 id="admin-title">📋 Quản lý dữ liệu (管理画面)</h3>
            <button class="admin-close-btn" onclick="closeAdmin()">✕</button>
        </div>
        <div class="admin-body">
            <div class="admin-toggle-row">
                <span>Hiển thị bản dịch tiếng Việt của câu ví dụ<br>（例文のベトナム語訳を表示）</span>
                <label class="switch">
                    <input type="checkbox" id="toggle-example-vn" onchange="onToggleExampleVN(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <input type="text" class="admin-search" id="admin-search" placeholder="Tìm kiếm (kanji, nghĩa, ví dụ...)" oninput="renderAdminTable()">
            <div class="admin-count" id="admin-count"></div>
            <div class="admin-actions">
                <button class="admin-action-btn" onclick="exportCSV()">📥 Xuất CSV</button>
                <button class="admin-action-btn" onclick="printTable()">🖨️ In</button>
            </div>
            <div style="overflow-x:auto;">
                <table class="admin-table" id="admin-table">
                    <thead id="admin-thead"></thead>
                    <tbody id="admin-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="print-area"></div>

<script>

    let currentIndex = 0;

    function shuffleCards() {
        for (let i = flashcards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
        }
        currentIndex = 0;
        renderCard();
    }

    function exportCSV() {
        const thead = document.getElementById('admin-thead');
        const tbody = document.getElementById('admin-tbody');
        const headers = Array.from(thead.querySelectorAll('th')).map(th => th.textContent);
        const rows = Array.from(tbody.querySelectorAll('tr')).map(tr =>
            Array.from(tr.querySelectorAll('td')).map(td => td.textContent.trim())
        );
        const escapeCsv = (v) => '"' + String(v).replace(/"/g, '""') + '"';
        const lines = [headers, ...rows].map(row => row.map(escapeCsv).join(','));
        const csv = '\uFEFF' + lines.join('\r\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = (document.title || 'data').replace(/[^\w\-]+/g, '_') + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function printTable() {
        const title = document.getElementById('admin-title').textContent;
        const theadHtml = document.getElementById('admin-thead').innerHTML;
        const tbodyHtml = document.getElementById('admin-tbody').innerHTML;
        const printArea = document.getElementById('print-area');
        printArea.innerHTML = `<h2>${title}</h2><table><thead>${theadHtml}</thead><tbody>${tbodyHtml}</tbody></table>`;
        window.print();
    }

    // --- Admin settings: show/hide Vietnamese translation of example sentences ---
    let showExampleVN = localStorage.getItem('showExampleVN');
    showExampleVN = showExampleVN === null ? true : showExampleVN === 'true';

    function onToggleExampleVN(checked) {
        showExampleVN = checked;
        localStorage.setItem('showExampleVN', checked);
        renderCard();
    }

    function openAdmin(event) {
        if (event) event.stopPropagation();
        document.getElementById('toggle-example-vn').checked = showExampleVN;
        document.getElementById('admin-search').value = '';
        document.getElementById('admin-overlay').classList.add('show');
        renderAdminTable();
    }

    function closeAdmin() {
        document.getElementById('admin-overlay').classList.remove('show');
    }

    function closeAdminOnOverlay(event) {
        if (event.target.id === 'admin-overlay') closeAdmin();
    }

        const query = document.getElementById('admin-search').value.trim().toLowerCase();
        const thead = document.getElementById('admin-thead');
        const tbody = document.getElementById('admin-tbody');

        thead.innerHTML = `<tr>
            <th>Tha động từ (他動詞)</th><th>Nghĩa</th><th>Câu ví dụ</th><th>Bản dịch VN</th>
            <th>Tự động từ (自動詞)</th><th>Nghĩa</th><th>Câu ví dụ</th><th>Bản dịch VN</th>
        </tr>`;

        const filtered = flashcards.filter(c => {
            if (!query) return true;
            const hay = [c.vt.kanji, c.vt.meaning, c.vt.example_text, c.vt.example_vn,
                         c.vi.kanji, c.vi.meaning, c.vi.example_text, c.vi.example_vn].join(' ').toLowerCase();
            return hay.includes(query);
        });

        document.getElementById('admin-count').textContent = `${filtered.length} / ${flashcards.length} thẻ`;

        tbody.innerHTML = filtered.map(c => `
            <tr>
                <td>${c.vt.kanji}</td>
                <td>${c.vt.meaning}</td>
                <td>${c.vt.example_text}</td>
                <td>${c.vt.example_vn || ''}</td>
                <td>${c.vi.kanji}</td>
                <td>${c.vi.meaning}</td>
                <td>${c.vi.example_text}</td>
                <td>${c.vi.example_vn || ''}</td>
            </tr>
        `).join('');
    }

    function toggleMenu(event) {
        event.stopPropagation();
        document.getElementById("dropdown-menu").classList.toggle("show");
    }
    
    window.onclick = function(event) {
        if (!event.target.matches('.icon-btn')) {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            for (var i = 0; i < dropdowns.length; i++) {
                if (dropdowns[i].classList.contains('show')) {
                    dropdowns[i].classList.remove('show');
                }
            }
        }
    }

    // --- TTS LOGIC (Edge TTS via the KANJI project's Vercel proxy, with
    // browser SpeechSynthesis as a fallback if the network call fails) ---
    const TTS_ENDPOINT = 'https://kanji-beta.vercel.app/api/tts';
    const ttsCache = new Map();
    let currentAudio = null;

    function speakFallback(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }

    function speakText(text, event) {
        if (event) event.stopPropagation();
        // Remove ruby tags (<rt>) and any other HTML markup before speaking
        const clean = (text || '').replace(/<rt>[\s\S]*?<\/rt>/g, '').replace(/<[^>]+>/g, '').trim();
        if (!clean) return;

        if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        const btn = event ? event.currentTarget : null;

        const cachedUrl = ttsCache.get(clean);
        if (cachedUrl) {
            currentAudio = new Audio(cachedUrl);
            currentAudio.play().catch(() => speakFallback(clean));
            return;
        }

        if (btn) { btn.dataset.origText = btn.textContent; btn.textContent = '⏳'; }
        fetch(`${TTS_ENDPOINT}?text=${encodeURIComponent(clean)}&voice=ja-JP-NanamiNeural`)
            .then(res => { if (!res.ok) throw new Error('tts failed'); return res.blob(); })
            .then(blob => {
                const url = URL.createObjectURL(blob);
                ttsCache.set(clean, url);
                currentAudio = new Audio(url);
                return currentAudio.play();
            })
            .catch(() => speakFallback(clean))
            .finally(() => { if (btn) btn.textContent = btn.dataset.origText || '🔊'; });
    }

    function renderCard() {
        const card = flashcards[currentIndex];
        
        // Front (Transitive)
        document.getElementById('front-headword').innerHTML = card.vt.html;
        document.getElementById('front-vn').textContent = card.vt.meaning;
        document.getElementById('front-example').innerHTML = card.vt.example_html +
            (showExampleVN && card.vt.example_vn ? `<div class="example-vn">${card.vt.example_vn}</div>` : '');
        
        document.getElementById('front-speaker').onclick = (e) => speakText(card.vt.example_html, e);
        
        // Back (Intransitive)
        document.getElementById('back-headword').innerHTML = card.vi.html;
        document.getElementById('back-vn').textContent = card.vi.meaning;
        document.getElementById('back-example').innerHTML = card.vi.example_html +
            (showExampleVN && card.vi.example_vn ? `<div class="example-vn">${card.vi.example_vn}</div>` : '');
        
        document.getElementById('back-speaker').onclick = (e) => speakText(card.vi.example_html, e);
        
        document.getElementById('current-idx').textContent = currentIndex + 1;
        document.getElementById('total-cards').textContent = flashcards.length;
        document.getElementById('btn-prev').disabled = currentIndex === 0;
        document.getElementById('btn-next').disabled = currentIndex === flashcards.length - 1;
        
        document.getElementById('flashcard').classList.remove('is-flipped');
    }

    function flipCard() {
        document.getElementById('flashcard').classList.toggle('is-flipped');
    }

    function nextCard() {
        if (currentIndex < flashcards.length - 1) {
            currentIndex++;
            renderCard();
        }
    }

    function prevCard() {
        if (currentIndex > 0) {
            currentIndex--;
            renderCard();
        }
    }

    renderCard();
</script>
</body>
</html>
