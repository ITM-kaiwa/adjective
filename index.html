<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Từ Trái Nghĩa Tiếng Nhật</title>
    <style>
        :root {
            --sand-50: #FBF8F1;
            --sand-100: #F6F0E4;
            --sand-200: #EDE2CB;
            --sand-300: #E0CFA8;
            --sand-400: #CBAE78;
            --sand-500: #B08D57;
            --sand-600: #8C6D3F;
            --sand-700: #6B5230;
            --sand-800: #4C3A22;
            --lemon-100: #FDFAE2;
            --lemon-200: #FAF3B8;
            --lemon-300: #F4E888;
            --leaf-100: #E7F3DE;
            --leaf-200: #D0E8BE;
            --leaf-300: #B4D89A;
            --leaf-400: #95C476;
            --kanjibrown: #6B4226;
            --kanjibrown-dark: #4A2C18;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--sand-100);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        .app-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
            background: var(--sand-50);
            border-radius: 15px;
            box-shadow: 0 8px 24px -8px rgba(107, 66, 38, 0.35);
        }
        /* Flashcard Mode Styles */
        .flashcard-container {
            perspective: 1000px;
            margin: 20px 0;
            height: 350px;
            cursor: pointer;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 10px 20px rgba(107, 66, 38, 0.2);
            border-radius: 15px;
            background-color: var(--lemon-200);
            border: 2px solid var(--lemon-300);
        }
        .flashcard.is-flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            padding: 20px;
            box-sizing: border-box;
        }
        .card-back {
            transform: rotateY(180deg);
            background-color: var(--lemon-100);
            border: 2px solid var(--lemon-300);
        }
        .lesson-tag {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: var(--leaf-300);
            color: var(--kanjibrown-dark);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
        }
        .lesson-tag.new-word {
            background-color: var(--sand-500);
            color: var(--sand-50);
        }
        .speaker-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: var(--sand-200);
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 45px;
            height: 45px;
            box-shadow: 0 2px 5px rgba(107, 66, 38, 0.15);
        }
        .speaker-btn:hover {
            background-color: var(--sand-300);
        }
        .word-kana {
            font-size: 48px;
            font-weight: bold;
            color: var(--kanjibrown);
            margin-bottom: 10px;
        }
        .word-kanji {
            font-size: 24px;
            color: var(--sand-700);
            margin-bottom: 15px;
        }
        .word-vn {
            font-size: 22px;
            color: var(--kanjibrown-dark);
            font-weight: bold;
        }
        .no-antonym {
            font-size: 32px;
            color: var(--sand-400);
            font-weight: bold;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
        .nav-btn {
            background-color: var(--leaf-200);
            color: var(--kanjibrown);
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
        }
        .nav-btn:hover {
            background-color: var(--leaf-300);
        }
        .nav-btn:disabled {
            background-color: var(--sand-200);
            color: var(--sand-400);
            cursor: not-allowed;
            transform: none !important;
        }
        .progress {
            font-size: 18px;
            color: var(--sand-700);
            font-weight: bold;
        }
        .mode-switch-btn {
            background-color: var(--sand-600);
            color: var(--sand-50);
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .mode-switch-btn:hover {
            background-color: var(--sand-700);
        }
        .shuffle-btn {
            background-color: var(--sand-600);
            color: var(--sand-50);
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .shuffle-btn:hover {
            background-color: var(--sand-700);
        }
        .mode-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* --- Source toggle --- */
        .source-toggle-wrap { margin: 4px 0 10px; }
        .source-toggle-btn {
            background-color: var(--lemon-100);
            border: 2px solid var(--sand-400);
            color: var(--kanjibrown-dark);
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
        }
        .source-toggle-btn:hover { background-color: var(--lemon-200); }

        /* Button Animations */
        .nav-btn, .mode-switch-btn, .shuffle-btn, .quit-btn, .choice-btn, .speaker-btn, .source-toggle-btn, .icon-circle-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-btn:active, .mode-switch-btn:active, .shuffle-btn:active, .quit-btn:active, .choice-btn:active, .speaker-btn:active, .source-toggle-btn:active, .icon-circle-btn:active {
            transform: scale(0.92);
        }

        /* Quiz Mode Styles */
        #quiz-mode {
            display: none;
        }
        .small-card {
            width: 100%;
            height: 180px;
            background-color: var(--lemon-200);
            box-shadow: 0 5px 15px rgba(107, 66, 38, 0.2);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            border: 2px solid var(--lemon-300);
            position: relative;
        }
        .small-card .word-kana {
            font-size: 36px;
            margin-bottom: 5px;
        }
        .small-card .word-kanji {
            font-size: 20px;
            margin-bottom: 5px;
        }
        .small-card .word-vn {
            font-size: 18px;
        }
        .quiz-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .quiz-controls .nav-btn {
            padding: 10px 20px;
            font-size: 18px;
        }
        .quit-btn {
            background-color: #EF4444;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
        }
        .quit-btn:hover {
            background-color: #DC2626;
        }
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .choice-btn {
            background-color: var(--sand-50);
            border: 2px solid var(--sand-300);
            color: var(--sand-700);
            padding: 15px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .choice-btn:hover {
            background-color: var(--sand-100);
        }
        .choice-btn.correct {
            background-color: var(--leaf-200);
            color: var(--kanjibrown-dark);
            border-color: var(--leaf-400);
        }
        .choice-btn.wrong {
            background-color: #FEE2E2;
            color: #B91C1C;
            border-color: #FCA5A5;
        }
        .choice-btn:disabled {
            cursor: not-allowed;
            transform: none !important;
        }
        #quiz-feedback {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            min-height: 27px;
        }

        /* --- Admin / Settings Panel --- */
        .header-icons {
            position: absolute;
            right: 0;
            display: flex;
            gap: 6px;
        }
        .icon-circle-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: var(--sand-200);
            color: var(--sand-700);
            border: none;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-circle-btn:hover { background-color: var(--sand-300); }

        .admin-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(74, 44, 24, 0.45);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .admin-overlay.show { display: flex; }
        .admin-panel {
            background: var(--sand-50);
            border-radius: 15px;
            width: 100%;
            max-width: 900px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(74, 44, 24, 0.35);
            text-align: left;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--sand-300);
        }
        .admin-header h3 { margin: 0; font-size: 18px; color: var(--kanjibrown-dark); }
        .admin-close-btn {
            background: none; border: none; font-size: 24px; cursor: pointer; color: var(--sand-600);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .admin-close-btn:hover { color: var(--kanjibrown-dark); }
        .admin-close-btn:active { transform: scale(0.9); }
        .admin-body {
            padding: 16px 20px;
            overflow-y: auto;
        }
        .admin-search {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid var(--sand-300);
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        .admin-count {
            font-size: 13px;
            color: var(--sand-600);
            margin-bottom: 8px;
        }
        .admin-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .admin-action-btn {
            background-color: var(--leaf-200);
            color: var(--kanjibrown-dark);
            border: none;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .admin-action-btn:hover { background-color: var(--leaf-300); }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .admin-table th, .admin-table td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--sand-200);
            vertical-align: top;
        }
        .admin-table th {
            background: var(--sand-100);
            color: var(--kanjibrown-dark);
            position: sticky;
            top: 0;
        }
        .admin-table tr:hover { background: var(--lemon-100); }

        /* --- Print --- */
        #print-area { display: none; }
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area {
                display: block;
                position: absolute;
                top: 0; left: 0; width: 100%;
            }
            #print-area h2 { color: #000; }
            #print-area table { width: 100%; border-collapse: collapse; }
            #print-area th, #print-area td {
                border: 1px solid #333;
                padding: 6px 8px;
                font-size: 12px;
                text-align: left;
            }
            #print-area th { background: #eee; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-container" style="width: 100%; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; position: relative;">
        <div class="dropdown" style="position: absolute; left: 0;">
            <button class="icon-btn" onclick="toggleMenu(event)" style="background: none; border: none; font-size: 28px; cursor: pointer; transition: transform 0.2s;">💡</button>
            <div id="dropdown-menu" class="dropdown-content" style="display: none; position: absolute; background-color: white; min-width: 280px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2); z-index: 10; border-radius: 8px; top: 40px; left: 0; text-align: left;">
                <a href="index.html" style="color: #9C27B0; padding: 12px 16px; text-decoration: none; display: block; font-weight: bold; border-bottom: 1px solid #eee;">Từ trái nghĩa (Tính từ)</a>
                <a href="verbs.html" style="color: black; padding: 12px 16px; text-decoration: none; display: block; font-weight: bold; border-bottom: 1px solid #eee;">Tự/Tha động từ (自動詞他動詞練習)</a>
                <a href="doushi.html" style="color: black; padding: 12px 16px; text-decoration: none; display: block; font-weight: bold;">Động từ chung (一般動詞の対義語)</a>
            </div>
        </div>
        <h2 id="page-title" style="margin: 0;">Từ Trái Nghĩa (Tính từ)</h2>
        <div class="header-icons">
            <button class="icon-circle-btn" onclick="shuffleCards()" title="Xáo trộn thẻ (Shuffle)">🔀</button>
            <button class="icon-circle-btn" onclick="openAdmin(event)" title="Quản lý dữ liệu">⚙️</button>
        </div>
    </div>

    <div class="source-toggle-wrap">
        <button class="source-toggle-btn" id="source-toggle-btn" onclick="toggleSource()"></button>
    </div>

    <!-- FLASHCARD MODE -->
    <div id="flashcard-mode">
        <button class="mode-switch-btn" onclick="startQuiz()">Trắc nghiệm từ trái nghĩa (3択クイズ)</button>
        <div class="flashcard-container" onclick="flipCard()">
            <div class="flashcard" id="flashcard">
                <div class="card-face card-front">
                    <div class="lesson-tag" id="front-lesson"></div>
                    <button class="speaker-btn" id="front-speaker">🔊</button>
                    <div class="word-kana" id="front-kana"></div>
                    <div class="word-kanji" id="front-kanji"></div>
                    <div class="word-vn" id="front-vn"></div>
                </div>
                <div class="card-face card-back">
                    <div class="lesson-tag" id="back-lesson"></div>
                    <button class="speaker-btn" id="back-speaker">🔊</button>
                    <div id="back-content">
                        <div class="word-kana" id="back-kana"></div>
                        <div class="word-kanji" id="back-kanji"></div>
                        <div class="word-vn" id="back-vn"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="controls">
            <button class="nav-btn" onclick="prevCard()" id="btn-prev">&lt;&lt;</button>
            <div class="progress"><span id="current-idx">1</span> / <span id="total-cards"></span></div>
            <button class="nav-btn" onclick="nextCard()" id="btn-next">&gt;&gt;</button>
        </div>
    </div>

    <!-- QUIZ MODE -->
    <div id="quiz-mode">
        <div class="small-card">
            <button class="speaker-btn" id="quiz-speaker" style="top: 10px; right: 10px; width: 40px; height: 40px; font-size: 20px;">🔊</button>
            <div class="word-kana" id="quiz-kana"></div>
            <div class="word-kanji" id="quiz-kanji"></div>
            <div class="word-vn" id="quiz-vn"></div>
        </div>
        
        <div class="quiz-controls">
            <button class="nav-btn" onclick="prevQuiz()" id="quiz-btn-prev">&lt;&lt;</button>
            <button class="quit-btn" onclick="quitQuiz()">やめる (Thoát)</button>
            <button class="nav-btn" onclick="nextQuiz()" id="quiz-btn-next">&gt;&gt;</button>
        </div>
        
        <div class="choices-container" id="choices-container">
            <!-- Choices will be injected here -->
        </div>
        
        <div id="quiz-feedback"></div>
        <div class="progress" style="margin-top: 10px;"><span id="quiz-current-idx">1</span> / <span id="quiz-total-cards"></span></div>
    </div>
</div>

<!-- ADMIN / SETTINGS PANEL -->
<div class="admin-overlay" id="admin-overlay" onclick="closeAdminOnOverlay(event)">
    <div class="admin-panel" onclick="event.stopPropagation()">
        <div class="admin-header">
            <h3 id="admin-title">📋 Quản lý dữ liệu (管理画面)</h3>
            <button class="admin-close-btn" onclick="closeAdmin()">✕</button>
        </div>
        <div class="admin-body">
            <input type="text" class="admin-search" id="admin-search" placeholder="Tìm kiếm (kana, kanji, nghĩa...)" oninput="renderAdminTable()">
            <div class="admin-count" id="admin-count"></div>
            <div class="admin-actions">
                <button class="admin-action-btn" onclick="exportCSV()">📥 Xuất CSV</button>
                <button class="admin-action-btn" onclick="printTable()">🖨️ In</button>
            </div>
            <div style="overflow-x:auto;">
                <table class="admin-table" id="admin-table">
                    <thead id="admin-thead"></thead>
                    <tbody id="admin-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="print-area"></div>

    const SOURCES = {
        mnn: {
            toggleText: 'Đổi dữ liệu (chuyển sang \'いろどり\')',
            pageTitle: 'Từ Trái Nghĩa (Tính từ)',
            adminTitle: '📋 Quản lý dữ liệu (管理画面)',
            searchPlaceholder: 'Tìm kiếm (kana, kanji, nghĩa...)',
            headers: ['Bài', 'Kana', 'Kanji', 'Nghĩa VN', 'Từ trái nghĩa', 'Kanji đối', 'Nghĩa VN đối', 'Bài đối'],
            countSuffix: ' thẻ',
            noAntonymHtml: '<div class="no-antonym">Không có từ trái nghĩa<br>(対義語無し)</div>',
            correctText: '⭕ Chính xác! (正解)',
            wrongText: '❌ Sai rồi! (不正解)',
            data: DATA_MNN,
        },
        irodori: {
            toggleText: 'Đổi dữ liệu (chuyển sang \'Minna no Nihongo\')',
            pageTitle: 'Từ Trái Nghĩa (Tính từ) - いろどり',
            adminTitle: '📋 Quản lý dữ liệu - いろどり (管理画面)',
            searchPlaceholder: 'Tìm kiếm (kana, kanji, nghĩa...)',
            headers: ['Bài', 'Kana', 'Kanji', 'Nghĩa VN', 'Từ trái nghĩa', 'Kanji đối', 'Nghĩa VN đối', 'Bài đối'],
            countSuffix: ' thẻ',
            noAntonymHtml: '<div class="no-antonym">Không có từ trái nghĩa<br>(対義語無し)</div>',
            correctText: '⭕ Chính xác! (正解)',
            wrongText: '❌ Sai rồi! (不正解)',
            data: DATA_IRODORI,
        },
    };

    let currentSource = 'mnn';
    let flashcards = SOURCES[currentSource].data;

    function getMeaning(entry) {
        return entry.vn !== undefined ? entry.vn : entry.meaning;
    }
    function formatLessonFront(entry) {
        return currentSource === 'mnn' ? ('Bài ' + entry.lesson.replace('Lesson ', '')) : entry.lesson;
    }
    function formatLessonBack(entry) {
        if (currentSource === 'mnn') return entry.is_new ? 'Chưa học (未習語)' : ('Bài ' + entry.lesson);
        return entry.lesson;
    }
    function isNew(entry) {
        return !!(entry && entry.is_new);
    }
    function adminLessonFront(entry) {
        return currentSource === 'mnn' ? entry.lesson.replace('Lesson ', '') : entry.lesson;
    }
    function adminLessonBack(entry) {
        if (!entry) return '—';
        if (currentSource === 'mnn') return entry.is_new ? 'Chưa học' : entry.lesson;
        return entry.lesson;
    }

    function applySourceUI() {
        const src = SOURCES[currentSource];
        document.getElementById('source-toggle-btn').textContent = src.toggleText;
        document.getElementById('page-title').textContent = src.pageTitle;
        document.getElementById('admin-title').textContent = src.adminTitle;
        document.getElementById('admin-search').placeholder = src.searchPlaceholder;
    }

    function toggleSource() {
        currentSource = currentSource === 'mnn' ? 'irodori' : 'mnn';
        flashcards = SOURCES[currentSource].data;
        currentIndex = 0;
        applySourceUI();
        document.getElementById('quiz-mode').style.display = 'none';
        document.getElementById('flashcard-mode').style.display = 'block';
        renderCard();
        if (document.getElementById('admin-overlay').classList.contains('show')) {
            renderAdminTable();
        }
    }

    let currentIndex = 0;

    function shuffleCards() {
        for (let i = flashcards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
        }
        currentIndex = 0;
        renderCard();
    }

    // Quiz State
    let quizCards = [];
    let currentQuizIndex = 0;
    let quizChoices = [];
    let hasAnswered = false;

    function exportCSV() {
        const thead = document.getElementById('admin-thead');
        const tbody = document.getElementById('admin-tbody');
        const headers = Array.from(thead.querySelectorAll('th')).map(th => th.textContent);
        const rows = Array.from(tbody.querySelectorAll('tr')).map(tr =>
            Array.from(tr.querySelectorAll('td')).map(td => td.textContent.trim())
        );
        const escapeCsv = (v) => '"' + String(v).replace(/"/g, '""') + '"';
        const lines = [headers, ...rows].map(row => row.map(escapeCsv).join(','));
        const csv = '\uFEFF' + lines.join('\r\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = (document.title || 'data').replace(/[^\w\-]+/g, '_') + '_' + currentSource + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function printTable() {
        const title = document.getElementById('admin-title').textContent;
        const theadHtml = document.getElementById('admin-thead').innerHTML;
        const tbodyHtml = document.getElementById('admin-tbody').innerHTML;
        const printArea = document.getElementById('print-area');
        printArea.innerHTML = `<h2>${title}</h2><table><thead>${theadHtml}</thead><tbody>${tbodyHtml}</tbody></table>`;
        window.print();
    }

    function openAdmin(event) {
        if (event) event.stopPropagation();
        document.getElementById('admin-search').value = '';
        document.getElementById('admin-overlay').classList.add('show');
        renderAdminTable();
    }

    function closeAdmin() {
        document.getElementById('admin-overlay').classList.remove('show');
    }

    function closeAdminOnOverlay(event) {
        if (event.target.id === 'admin-overlay') closeAdmin();
    }

    function renderAdminTable() {
        const src = SOURCES[currentSource];
        const query = document.getElementById('admin-search').value.trim().toLowerCase();
        const thead = document.getElementById('admin-thead');
        const tbody = document.getElementById('admin-tbody');

        thead.innerHTML = '<tr>' + src.headers.map(h => `<th>${h}</th>`).join('') + '</tr>';

        const filtered = flashcards.filter(c => {
            if (!query) return true;
            const hay = [c.front.kana, c.front.kanji, getMeaning(c.front),
                         c.back ? c.back.kana : '', c.back ? c.back.kanji : '', c.back ? getMeaning(c.back) : '']
                        .filter(Boolean).join(' ').toLowerCase();
            return hay.includes(query);
        });

        document.getElementById('admin-count').textContent = `${filtered.length} / ${flashcards.length}${src.countSuffix}`;

        tbody.innerHTML = filtered.map(c => `
            <tr>
                <td>${adminLessonFront(c.front)}</td>
                <td>${c.front.kana}</td>
                <td>${c.front.kanji || ''}</td>
                <td>${getMeaning(c.front)}</td>
                <td>${c.back ? c.back.kana : '—'}</td>
                <td>${c.back ? (c.back.kanji || '') : '—'}</td>
                <td>${c.back ? getMeaning(c.back) : (currentSource === 'mnn' ? '(Không có)' : '(none)')}</td>
                <td>${adminLessonBack(c.back)}</td>
            </tr>
        `).join('');
    }

    function toggleMenu(event) {
        event.stopPropagation();
        var menu = document.getElementById("dropdown-menu");
        if (menu.style.display === "block") {
            menu.style.display = "none";
        } else {
            menu.style.display = "block";
        }
    }
    
    window.onclick = function(event) {
        if (!event.target.matches('.icon-btn')) {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            for (var i = 0; i < dropdowns.length; i++) {
                if (dropdowns[i].style.display === "block") {
                    dropdowns[i].style.display = "none";
                }
            }
        }
    }


    // --- TTS LOGIC (Edge TTS via the KANJI project's Vercel proxy, with
    // browser SpeechSynthesis as a fallback if the network call fails) ---
    const TTS_ENDPOINT = 'https://kanji-beta.vercel.app/api/tts';
    const ttsCache = new Map();
    let currentAudio = null;

    function speakFallback(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }

    function speakText(text, event) {
        if (event) event.stopPropagation();
        const clean = (text || '').replace(/<rt>[\s\S]*?<\/rt>/g, '').replace(/<[^>]+>/g, '').trim();
        if (!clean) return;

        if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        const btn = event ? event.currentTarget : null;

        const cachedUrl = ttsCache.get(clean);
        if (cachedUrl) {
            currentAudio = new Audio(cachedUrl);
            currentAudio.play().catch(() => speakFallback(clean));
            return;
        }

        if (btn) { btn.dataset.origText = btn.textContent; btn.textContent = '⏳'; }
        fetch(`${TTS_ENDPOINT}?text=${encodeURIComponent(clean)}&voice=ja-JP-NanamiNeural`)
            .then(res => { if (!res.ok) throw new Error('tts failed'); return res.blob(); })
            .then(blob => {
                const url = URL.createObjectURL(blob);
                ttsCache.set(clean, url);
                currentAudio = new Audio(url);
                return currentAudio.play();
            })
            .catch(() => speakFallback(clean))
            .finally(() => { if (btn) btn.textContent = btn.dataset.origText || '🔊'; });
    }

    // --- FLASHCARD MODE LOGIC ---
    function renderCard() {
        const card = flashcards[currentIndex];
        
        document.getElementById('front-lesson').textContent = formatLessonFront(card.front);
        document.getElementById('front-lesson').className = isNew(card.front) ? 'lesson-tag new-word' : 'lesson-tag';
        document.getElementById('front-kana').textContent = card.front.kana;
        document.getElementById('front-kanji').textContent = card.front.kanji || '';
        document.getElementById('front-vn').textContent = getMeaning(card.front);

        // Speaker Front
        document.getElementById('front-speaker').onclick = (e) => speakText(card.front.kana, e);

        const backContent = document.getElementById('back-content');
        const backLesson = document.getElementById('back-lesson');
        const backSpeaker = document.getElementById('back-speaker');

        if (!card.back) {
            backLesson.style.display = 'none';
            backSpeaker.style.display = 'none';
            backContent.innerHTML = SOURCES[currentSource].noAntonymHtml;
        } else {
            backLesson.style.display = 'block';
            backSpeaker.style.display = 'flex';
            backSpeaker.onclick = (e) => speakText(card.back.kana, e);

            backLesson.textContent = formatLessonBack(card.back);
            backLesson.className = isNew(card.back) ? 'lesson-tag new-word' : 'lesson-tag';
            backContent.innerHTML = `
                <div class="word-kana">${card.back.kana}</div>
                <div class="word-kanji">${card.back.kanji || ''}</div>
                <div class="word-vn">${getMeaning(card.back)}</div>
            `;
        }
        
        document.getElementById('current-idx').textContent = currentIndex + 1;
        document.getElementById('total-cards').textContent = flashcards.length;
        document.getElementById('btn-prev').disabled = currentIndex === 0;
        document.getElementById('btn-next').disabled = currentIndex === flashcards.length - 1;
        
        document.getElementById('flashcard').classList.remove('is-flipped');
    }

    function flipCard() {
        document.getElementById('flashcard').classList.toggle('is-flipped');
    }

    function nextCard() {
        if (currentIndex < flashcards.length - 1) {
            currentIndex++;
            renderCard();
        }
    }

    function prevCard() {
        if (currentIndex > 0) {
            currentIndex--;
            renderCard();
        }
    }

    // --- QUIZ MODE LOGIC ---
    function startQuiz() {
        quizCards = flashcards.filter(c => c.back !== null);
        quizCards = quizCards.sort(() => Math.random() - 0.5);
        
        if (quizCards.length === 0) return; 
        
        currentQuizIndex = 0;
        document.getElementById('flashcard-mode').style.display = 'none';
        document.getElementById('quiz-mode').style.display = 'block';
        
        renderQuiz();
    }

    function quitQuiz() {
        document.getElementById('quiz-mode').style.display = 'none';
        document.getElementById('flashcard-mode').style.display = 'block';
        renderCard();
    }

    function getDistractors(correctBack, count) {
        const allBacks = flashcards.filter(c => c.back !== null && c.back.kana !== correctBack.kana).map(c => c.back);
        const uniqueBacks = [];
        const seen = new Set();
        for (let b of allBacks) {
            if (!seen.has(b.kana)) {
                seen.add(b.kana);
                uniqueBacks.push(b);
            }
        }
        const shuffled = uniqueBacks.sort(() => 0.5 - Math.random());
        return shuffled.slice(0, count);
    }

    function renderQuiz() {
        hasAnswered = false;
        const card = quizCards[currentQuizIndex];
        
        document.getElementById('quiz-kana').textContent = card.front.kana;
        document.getElementById('quiz-kanji').textContent = card.front.kanji || '';
        document.getElementById('quiz-vn').textContent = getMeaning(card.front);
        
        document.getElementById('quiz-speaker').onclick = (e) => speakText(card.front.kana, e);
        
        const correctChoice = card.back;
        const distractors = getDistractors(correctChoice, 2);
        
        quizChoices = [correctChoice, ...distractors];
        quizChoices.sort(() => Math.random() - 0.5); 
        
        const container = document.getElementById('choices-container');
        container.innerHTML = '';
        
        quizChoices.forEach((choice, idx) => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            
            let text = choice.kana;
            if (choice.kanji) text += ` (${choice.kanji})`;
            
            btn.textContent = text;
            btn.onclick = () => selectChoice(idx, choice.kana === correctChoice.kana);
            container.appendChild(btn);
        });
        
        document.getElementById('quiz-feedback').textContent = '';
        document.getElementById('quiz-feedback').style.color = '#333';
        
        document.getElementById('quiz-btn-prev').disabled = currentQuizIndex === 0;
        document.getElementById('quiz-btn-next').disabled = currentQuizIndex === quizCards.length - 1;
        document.getElementById('quiz-current-idx').textContent = currentQuizIndex + 1;
        document.getElementById('quiz-total-cards').textContent = quizCards.length;
    }

    function selectChoice(selectedIndex, isCorrect) {
        if (hasAnswered) return;
        hasAnswered = true;
        
        const buttons = document.getElementById('choices-container').children;
        const card = quizCards[currentQuizIndex];
        
        for (let i = 0; i < buttons.length; i++) {
            buttons[i].disabled = true; 
            
            if (quizChoices[i].kana === card.back.kana) {
                buttons[i].classList.add('correct');
            }
        }
        
        const feedback = document.getElementById('quiz-feedback');
        const src = SOURCES[currentSource];
        if (isCorrect) {
            feedback.textContent = src.correctText;
            feedback.style.color = '#4CAF50';
        } else {
            buttons[selectedIndex].classList.add('wrong');
            feedback.textContent = src.wrongText;
            feedback.style.color = '#f44336';
        }
    }

    function nextQuiz() {
        if (currentQuizIndex < quizCards.length - 1) {
            currentQuizIndex++;
            renderQuiz();
        }
    }

    function prevQuiz() {
        if (currentQuizIndex > 0) {
            currentQuizIndex--;
            renderQuiz();
        }
    }

    applySourceUI();
    renderCard();
</script>
